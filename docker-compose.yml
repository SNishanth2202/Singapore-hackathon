services:
  # ---- MongoDB ----
  mongodb:
    profiles: ['legacy']
    image: mongo:7.0
    container_name: enterprise_radar_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: enterprise_radar
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - radar_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Neo4j ----
  neo4j:
    profiles: ['legacy']
    image: neo4j:5.15-community
    container_name: enterprise_radar_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-enterprise_radar_pass}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - '7474:7474'   # HTTP browser
      - '7687:7687'   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - radar_network
    healthcheck:
      test: ['CMD', 'neo4j', 'status']
      interval: 15s
      timeout: 10s
      retries: 5

  # ---- Backend (Node.js / Express) ----
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: enterprise_radar_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      STORAGE_MODE: memory
      LOCAL_DEMO_MODE: 'true'
      ENABLE_DEMO_CONTROLS: 'true'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-enterprise_radar_pass}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    ports:
      - '5000:5000'
    networks:
      - radar_network
    volumes:
      - ranking_data:/app/.local

  # ---- Frontend (placeholder — built by frontend agent) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise_radar_frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - radar_network

volumes:
  mongodb_data:
  neo4j_data:
  neo4j_logs:
  ranking_data:

networks:
  radar_network:
    driver: bridge
